<h1>Options: Dial-up / VPN</h1>
<p>IDMClone does not dial up modem or VPN connections: it uses the Internet connection Windows already has. This page is
shown as in IDM, but its options are disabled.</p>
<p>For the same reason, "Hang up modem when done" (and the <code>/h</code> command-line switch) does nothing.</p>
